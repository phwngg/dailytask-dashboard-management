<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyTask Dashboard Prototype</title>
<style>
:root{--p:#8500df;--ink:#252333;--muted:#8c899b;--line:#e9e4f1;--bg:#faf8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0}.brand{font-size:24px;font-weight:800;margin:0 12px 48px}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;font-style:normal;margin-right:8px}.nav-title{color:#aaa5b5;font-size:11px;font-weight:800;letter-spacing:1px;margin:0 12px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:13px 14px;text-align:left;color:#5d596c}.nav button.active,.nav button:hover{background:var(--p);color:#fff}.main{margin-left:235px;flex:1}.top{height:72px;padding:0 38px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.search{border:1px solid var(--line);border-radius:10px;padding:11px 16px;color:#aaa6b5;width:280px}.page{padding:42px;max-width:1400px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.heading h1{font-size:34px;margin:0 0 8px}.heading p{color:var(--muted);margin:0}.button{border:0;border-radius:9px;padding:11px 16px;background:var(--p);color:#fff;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 14px #31204d08}.card small{color:var(--muted)}.card strong{display:block;font-size:28px;margin-top:12px}.panel h2{margin:0 0 18px;font-size:18px}.rows{display:grid}.row{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);color:#5f5b6d}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.calendar b{text-align:center;color:#807b91;padding:7px}.day{min-height:105px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:#716c7d;text-align:left}.day.today{background:#effaf4;border:2px solid #31ae78;color:#168054}.event{display:block;margin-top:9px;padding:6px;border-radius:6px;background:#f0eaff;color:#7657c7;font-size:11px;white-space:nowrap;overflow:hidden}.hidden{display:none}.modal{position:fixed;inset:0;background:#21182d66;display:grid;place-items:center}.modal>div{background:#fff;border-radius:16px;padding:24px;width:min(520px,calc(100% - 32px))}.modal button{margin-top:18px}
</style>
<div class="app"><aside class="side"><div class="brand"><i>d</i>dailytask</div><div class="nav-title">MENU CHÍNH</div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><span>Daily Studio　›　<b id="crumb">Tổng quan</b></span><span class="search">⌕　Tìm công việc, nội dung...</span></header><div id="root"></div></main></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div><h2>Chi tiết lịch</h2><p>Popup prototype cho ngày hoặc sự kiện được chọn.</p><button class="button" onclick="closeModal()">Đóng</button></div></div>
<script>
const pages=['Tổng quan','Kế hoạch','Checklist','Lịch làm việc','Lịch quay & họp','Lương thưởng','Chỉ số kênh','Quản trị'],nav=document.querySelector('#nav'),root=document.querySelector('#root'),crumb=document.querySelector('#crumb');
const shell=(title,body,action='')=>`<section class="page"><div class="heading"><div><h1>${title}</h1><p>Không gian quản lý DailyTask.</p></div>${action}</div>${body}</section>`;
function overview(){return shell('Tổng quan',`<div class="cards">${['Việc cần làm|24','Đã hoàn thành|18','Nội dung sắp đăng|9','Lịch hôm nay|5'].map(x=>{let [a,b]=x.split('|');return `<div class="card"><small>${a}</small><strong>${b}</strong></div>`}).join('')}</div><div class="panel"><h2>Việc cần xử lý</h2><div class="rows"><div class="row">Hoàn thiện nội dung tuần 38 <b>Đang thực hiện</b></div><div class="row">Duyệt video giới thiệu sản phẩm <b>Chưa thực hiện</b></div></div></div>`,'<button class="button">＋ Tạo công việc</button>')}
function calendar(){let days=['T2','T3','T4','T5','T6','T7','CN'];return shell('Lịch quay & họp',`<div class="panel"><div class="heading"><h2>Tháng 9 năm 2026</h2><select><option>Toàn nhóm</option><option>Ngọc An</option></select><button class="button" onclick="openModal()">＋ Thêm lịch</button></div><div class="calendar">${days.map(d=>`<b>${d}</b>`).join('')}${Array.from({length:35},(_,i)=>`<button class="day ${i===21?'today':''}" onclick="openModal()">${i<30?i+1:''}${[6,7,9].includes(i)?'<span class="event">Lịch quay / họp</span>':''}</button>`).join('')}</div></div>`)}
function generic(title){return shell(title,`<div class="cards">${['Tổng số|24','Đang xử lý|9','Hoàn thành|15','Tỷ lệ|86%'].map(x=>{let [a,b]=x.split('|');return `<div class="card"><small>${a}</small><strong>${b}</strong></div>`}).join('')}</div><div class="panel"><h2>Danh sách ${title.toLowerCase()}</h2><div class="rows"><div class="row">Hạng mục mẫu thứ nhất <b>Đang xử lý</b></div><div class="row">Hạng mục mẫu thứ hai <b>Hoàn thành</b></div></div></div>`)}
function openModal(){document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}
function show(i){pages.forEach((p,n)=>nav.children[n].classList.toggle('active',n===i));crumb.textContent=pages[i];root.innerHTML=i===0?overview():i===4?calendar():generic(pages[i])}pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p;b.onclick=()=>show(i);nav.append(b)});show(0);
</script>
