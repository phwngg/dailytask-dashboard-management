<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="7380" viewBox="0 0 1440 7380">
<defs><style>.bg{fill:#faf8ff}.white{fill:#fff}.line{stroke:#e9e4f1;stroke-width:1}.ink{fill:#252333;font:700 28px Arial}.muted{fill:#8c899b;font:14px Arial}.card{fill:#fff;stroke:#e9e4f1}.day{fill:#fff;stroke:#e9e4f1}.past{fill:#f7f7f9;stroke:#e9e4f1}.today{fill:#effaf4;stroke:#31ae78;stroke-width:2}.small{fill:#807b91;font:700 12px Arial}.purple{fill:#8500df}</style></defs>
<g id="overview"><rect width="1440" height="900" class="bg"/><rect width="235" height="900" class="white"/><text x="32" y="58" class="ink">dailytask</text><text x="275" y="72" class="muted">Daily Studio　›　Tổng quan</text><text x="275" y="165" class="ink">Tổng quan</text><text x="275" y="195" class="muted">Tình hình công việc và hiệu suất nhóm trong tuần.</text><g transform="translate(275 240)"><rect width="250" height="120" rx="14" class="card"/><rect x="270" width="250" height="120" rx="14" class="card"/><rect x="540" width="250" height="120" rx="14" class="card"/><rect x="810" width="250" height="120" rx="14" class="card"/><text x="20" y="38" class="muted">Việc cần làm</text><text x="20" y="82" class="ink">24</text><text x="290" y="38" class="muted">Đã hoàn thành</text><text x="290" y="82" class="ink">18</text><text x="560" y="38" class="muted">Nội dung sắp đăng</text><text x="560" y="82" class="ink">9</text><text x="830" y="38" class="muted">Lịch hôm nay</text><text x="830" y="82" class="ink">5</text></g><rect x="275" y="390" width="1060" height="300" rx="14" class="card"/><text x="300" y="430" class="ink">Việc cần xử lý</text></g>
<g id="calendar" transform="translate(0 900)"><rect width="1440" height="900" class="bg"/><rect width="235" height="900" class="white"/><text x="32" y="58" class="ink">dailytask</text><text x="275" y="72" class="muted">Daily Studio　›　Lịch quay &amp; họp</text><text x="275" y="165" class="ink">Lịch quay &amp; họp</text><text x="275" y="195" class="muted">10 sự kiện · tháng 9 năm 2026</text><rect x="275" y="235" width="1060" height="590" rx="16" class="card"/><text x="305" y="280" class="ink">Tháng 9 năm 2026</text><rect x="555" y="252" width="125" height="36" rx="8" class="white line"/><text x="572" y="276" class="small">Toàn nhóm　⌄</text><rect x="700" y="252" width="120" height="36" rx="8" class="purple"/><text x="718" y="276" fill="#fff" font-size="13">＋ Thêm lịch</text><g transform="translate(300 320)">${['T2','T3','T4','T5','T6','T7','CN'].map((d,i)=>`<text x="${50+i*150}" y="0" class="small">${d}</text>`).join('')}${Array.from({length:35},(_,i)=>{let x=(i%7)*150,y=25+Math.floor(i/7)*105;return `<rect x="${x}" y="${y}" width="142" height="96" rx="10" class="${i===21?'today':i<21?'past':'day'}"/><text x="${x+10}" y="${y+24}" class="small">${i<30?i+1:''}</text>`}).join('')}</g></g>
${['plan','tasks','shifts','payroll','channels','admin'].map((id,i)=>`<g id="${id}" transform="translate(0 ${(i+2)*900})"><rect width="1440" height="900" class="bg"/><rect width="235" height="900" class="white"/><text x="32" y="58" class="ink">dailytask</text><text x="275" y="72" class="muted">Daily Studio　›　${id}</text><text x="275" y="165" class="ink">${id}</text><rect x="275" y="240" width="1060" height="150" rx="16" class="card"/><rect x="275" y="420" width="1060" height="280" rx="16" class="card"/></g>`).join('')}
</svg>
