services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/dailytask.db
      STATIC_DIR: /app/static
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PANCAKE_ENCRYPTION_KEY: ${PANCAKE_ENCRYPTION_KEY:?Set PANCAKE_ENCRYPTION_KEY in .env}
    volumes:
      - dailytask-data:/data
    ports:
      - "${HTTP_PORT:-8088}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  dailytask-data:
    name: dailytask-data-migrated
